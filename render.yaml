# Render blueprint — the API only. The web app is deployed separately on Vercel, which is
# why there is no static site here; its equivalent config lives in frontend/vercel.json.
#
# The load-bearing line in this file is `--workers 1`. The scheduler (app/scheduler.py) runs
# INSIDE the API process, so a second worker is a second copy of every recurring job: two
# catalogue sweeps, double the Ticketmaster spend, every push notification sent twice. If
# this service is ever rebuilt by hand in the dashboard, that flag is the one to not forget.

services:
  - type: web
    name: musicx-api
    runtime: python
    rootDir: backend
    # FREE TIER, deliberately, and it comes with a real cost: Render stops a free instance
    # after 15 minutes without traffic. This process IS the scheduler, so while it is asleep
    # nothing refreshes, no reminder fires, and no notification is delivered — and the first
    # request after a sleep waits ~50s for a cold start.
    #
    # That is an acceptable trade while proving the deploy works end to end. Change to
    # `starter` (and add a card) the moment real people depend on the background jobs.
    plan: free
    buildCommand: pip install -r requirements.txt
    # Migrations run before the server binds, so a deploy can never serve code that is ahead
    # of its schema. alembic is idempotent — on an unchanged database this is a no-op.
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    envVars:
      # Matches the local .venv the project was built against.
      - key: PYTHON_VERSION
        value: "3.12.13"
      # sync: false = "prompt me in the dashboard, never store it in git". All secrets.
      - key: DATABASE_URL          # Supabase SESSION POOLER uri, not the direct host:
        sync: false                # the direct one is IPv6-only and unreachable from here.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: TICKETMASTER_API_KEY
        sync: false
      - key: LASTFM_API_KEY
        sync: false
      - key: SPOTIFY_CLIENT_ID
        sync: false
      - key: SPOTIFY_CLIENT_SECRET
        sync: false
      - key: TRIPSURE_BASE_URL
        sync: false
      - key: TRIPSURE_TENANT_ID
        sync: false
      - key: TRIPSURE_API_KEY
        sync: false
      - key: TRIPSURE_FLIGHT_BASE_URL
        sync: false
      - key: TRIPSURE_FLIGHT_TENANT_ID
        sync: false
      - key: TRIPSURE_FLIGHT_API_KEY
        sync: false
      # The Vercel origin allowed to call this API from a browser. Set once Vercel has given
      # the site its URL. No trailing slash — the browser matches the string literally, so
      # "https://x.vercel.app/" never matches the Origin header "https://x.vercel.app".
      - key: CORS_ORIGINS
        sync: false
      # Supabase user ids permitted to hit /admin/*. Empty denies everyone, including you.
      - key: ADMIN_USER_IDS
        sync: false
